
name: Keep Insurance AI Copilot Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send inbound request to Render
        run: |
          python - <<'PY'
          import time
          import urllib.request
          from datetime import datetime, timezone

          url = "https://insurance-ai-copilot-6omc.onrender.com/docs"

          for attempt in range(2):
              try:
                  print(
                      "UTC start:",
                      datetime.now(timezone.utc).isoformat(),
                      flush=True
                  )

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Insurance-AI-KeepAlive/1.0"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=60) as response:
                      print("HTTP status:", response.status, flush=True)
                      print(
                          "UTC completed:",
                          datetime.now(timezone.utc).isoformat(),
                          flush=True
                      )
                      print("Render inbound request successful.")
                  break

              except Exception as exc:
                  print(f"Attempt {attempt + 1} failed: {exc}", flush=True)

                  if attempt == 1:
                      raise

                  time.sleep(5)
          PY
