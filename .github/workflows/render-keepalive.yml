
name: Keep Insurance AI Copilot Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send inbound request to Render
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://insurance-ai-copilot-6omc.onrender.com/docs"

          for attempt in range(2):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Insurance-AI-KeepAlive/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      print("HTTP status:", response.status)
                      print("Request sent successfully.")
                  break
              except Exception as exc:
                  print(f"Attempt {attempt + 1} failed: {exc}")
                  if attempt == 1:
                      raise
                  time.sleep(5)
          PY
